[project]
name = "alitheiahive-uprising"
version = "3.0.0"
description = "50/50 Autonomous Drone Swarm Simulator and WebGL Ground Control Station"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AlitheiaDeus" }
]
dependencies = [
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "pymavlink>=2.4.40",
]

[project.optional-dependencies]
dev = [
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
